function qnum(module,i,adv,text,correct,vals,formatter,expl,rule,trap){let o=mkNum(correct,vals,i+(adv?3:0),formatter);return{id:`${module}-${adv?'a':'b'}-${i}`,module,live:modules.find(m=>m.id===module).live,level:adv?'Nâng cao':'Cơ bản',text,opts:o.opts,a:o.a,expl,rule,trap,calc:true}}
const pairs=[[10,11,'B'],[20,22,'Ne'],[24,25,'Mg'],[35,37,'Cl'],[63,65,'Cu'],[79,81,'Br']];
function m1gen(i,adv){let [a,b,s]=pairs[i%pairs.length];let r1=[1,2,3,5,7][i%5],r2=[1,3,2,4,6][(i+2)%5];if(!adv){let M=(a*r1+b*r2)/(r1+r2);return qnum('m1',i,adv,`${s} có hai đồng vị ${a}${s} và ${b}${s}, tỉ lệ số nguyên tử ${r1}:${r2}. Nguyên tử khối trung bình gần bằng?`,M,[M+.4,M-.4,(a+b)/2],x=>fmt(x,2),`Trung bình phải có trọng số: (${a}×${r1}+${b}×${r2})/(${r1}+${r2})=${fmt(M,2)}.`,'M̄=(A₁x₁+A₂x₂)/(x₁+x₂)','Tỉ lệ không bằng nhau thì không được lấy (A₁+A₂)/2.')}let f=[.112,.2423,.275,.455,.61,.73][i%6],M=a*f+b*(1-f);return qnum('m1',i,adv,`Một nguyên tố có hai đồng vị số khối ${a} và ${b}; đồng vị ${a} chiếm ${fmt(f*100,2)}%. Tính M̄.`,M,[M+.2,M-.2,a*f+b*f],x=>fmt(x,3),`Đổi ${fmt(f*100,2)}%→${fmt(f,4)}; phần còn lại ${fmt((1-f)*100,2)}%. M̄=${a}·${fmt(f,4)}+${b}·${fmt(1-f,4)}=${fmt(M,3)}.`,'M̄=A₁f₁+A₂f₂','Hai phần trăm phải cộng đúng 100%.')}
function m2gen(i,adv){let a=[20,24,28,36][i%4],f3=[.088,.11,.031,.006][i%4],f2=[.003,.101,.047,.00063][i%4],f1=1-f2-f3,M=a*f1+(a+1)*f2+(a+2)*f3;if(!adv){return qnum('m2',i,adv,`Ba đồng vị có số khối ${a}, ${a+1}, ${a+2} với tỉ lệ ${fmt(f1*100,3)}%, ${fmt(f2*100,3)}%, ${fmt(f3*100,3)}%. M̄ bằng?`,M,[M+.3,M-.3,a+1],x=>fmt(x,4),`Nhân từng số khối với tỉ lệ thập phân rồi cộng: M̄=${fmt(M,4)}.`,'M̄=ΣAᵢfᵢ','Không chia thêm 100 nếu f đã ở dạng thập phân.')}let known3=f3, target=f1;return qnum('m2',i,adv,`Nguyên tố có ba đồng vị ${a}, ${a+1}, ${a+2}. Đồng vị nặng nhất chiếm ${fmt(known3*100,2)}%, M̄=${fmt(M,4)}. Phần trăm đồng vị ${a} gần bằng?`,target,[f2,1-target,target+.05],x=>pct(x,2),`Đặt f₁+f₂=${fmt((1-known3),4)} rồi dùng phương trình trung bình. Suy f₁=${fmt(target,4)}=${pct(target,2)}.`,'f₁+f₂+f₃=1; M̄=ΣAᵢfᵢ','Đừng coi phần còn lại là một đồng vị duy nhất khi còn 2 ẩn.')}
function m3gen(i,adv){let [a,b,s]=pairs[(i+1)%pairs.length],f=[.18,.25,.27,.46,.545,.727][i%6],M=a*f+b*(1-f);if(!adv){return qnum('m3',i,adv,`${s} có hai đồng vị ${a}${s}, ${b}${s} và M̄=${fmt(M,3)}. Tỉ lệ % số nguyên tử của ${a}${s} là?`,f,[1-f,f+.1,f-.1],x=>pct(x,1),`f(${a})=(${b}−${fmt(M,3)})/(${b}−${a})=${fmt(f,4)}.`,'f₁=(A₂−M̄)/(A₂−A₁)','Đây là % số nguyên tử, chưa phải % khối lượng.')}let heavyCount=[18,27,35,50][i%4],ratio=f/(1-f),light=heavyCount*ratio;return qnum('m3',i,adv,`Với ${s}: ${a}${s} chiếm ${pct(f,1)}, ${b}${s} chiếm ${pct(1-f,1)}. Nếu có ${heavyCount} nguyên tử ${b}${s}, số nguyên tử ${a}${s} xấp xỉ là?`,light,[light*.8,light*1.2,heavyCount/ratio],x=>Math.round(x)+' nguyên tử',`Số lượng tỉ lệ với phần trăm: n(${a})/n(${b})=${fmt(f,3)}/${fmt(1-f,3)}. Suy ≈${Math.round(light)}.`,'n₁/n₂=f₁/f₂','Không lấy chênh lệch phần trăm nhân trực tiếp với số nguyên tử.')}
function m4gen(i,adv){let A1=[24,35,63,79,20][i%5],d=[1,2,2,2,2][i%5],A2=A1+d,r1=[3,1,27,54.5,91][i%5],r2=[2,3,23,45.5,9][i%5],M=(A1*r1+A2*r2)/(r1+r2);if(!adv){return qnum('m4',i,adv,`Hai đồng vị có số khối A₁=${A1} và A₂ chưa biết. Tỉ lệ số nguyên tử ${r1}:${r2}, M̄=${fmt(M,3)}. A₂ bằng?`,A2,[A2-1,A2+1,A1],x=>Math.round(x).toString(),`Từ M̄(${r1+r2})=${A1}·${r1}+A₂·${r2}, suy A₂=${A2}.`,'A₂=[M̄(x₁+x₂)−A₁x₁]/x₂','Số khối phải là số nguyên.')}let base=[24,28,35,39][i%4],sum=base+(base+1)+(base+2),p1=[.923,.909,.7577,.9326][i%4],p2=[.047,.003,.001,.0001][i%4],p3=1-p1-p2,M2=base*p1+(base+1)*p2+(base+2)*p3;return qnum('m4',i,adv,`X có 3 đồng vị liên tiếp A, A+1, A+2; tổng số khối là ${sum}. Tỉ lệ lần lượt ${pct(p1,2)}, ${pct(p2,2)}, ${pct(p3,2)} và M̄=${fmt(M2,4)}. Số khối nhỏ nhất A là?`,base,[base-1,base+1,Math.round(M2)],x=>Math.round(x).toString(),`Ba số liên tiếp có tổng ${sum}: 3A+3=${sum} ⇒ A=${base}. Dữ kiện M̄ dùng để kiểm tra.`,'A₁+A₂+A₃=S; cùng nguyên tố ⇒ ΔA=ΔN','Khi có quan hệ số khối đơn giản, giải ràng buộc cấu trúc trước rồi mới dùng M̄.')}
const compounds=[{name:'KXO₃',k:1,other:39+3*16},{name:'H₃XO₃',k:1,other:3+3*16},{name:'X₂O',k:2,other:16},{name:'X(OH)₂',k:1,other:34},{name:'AlX₃',k:3,other:27},{name:'XSO₄',k:1,other:32.065+4*15.999}];
function m5gen(i,adv){let [a,b,s]=pairs[(i+3)%pairs.length],f=[.25,.27,.46,.73,.79,.625][i%6],M=a*f+b*(1-f),c=compounds[i%compounds.length],den=c.k*M+c.other,w=c.k*f*a/den;if(!adv){return qnum('m5',i,adv,`${s} có hai đồng vị ${a}${s}/${b}${s}; ${a}${s} chiếm ${pct(f,1)}. Trong 1 mol ${c.name.replace('X',s)}, phần trăm khối lượng của ${a}${s} là?`,w,[w+.05,w-.05,c.k*f*M/den],x=>pct(x,1),`Khối lượng ${a}${s} trong 1 mol hợp chất = ${c.k}·${fmt(f,3)}·${a}. Chia cho M_hợp chất=${fmt(den,3)} rồi ×100%.`,'%m(Aᵢ)=k·fᵢ·Aᵢ/M_hợp chất×100%','Tử số dùng đúng số khối Aᵢ, mẫu số dùng M̄ của nguyên tố.')}let j=(i+2)%compounds.length,c2=compounds[j],w2=c2.k*(1-f)*b/(c2.k*M+c2.other);return qnum('m5',i,adv,`${s} có M̄=${fmt(M,3)} từ ${a}${s}/${b}${s}. Biết ${a}${s} chiếm ${pct(f,1)}. Tính % khối lượng ${b}${s} trong ${c2.name.replace('X',s)}.`,w2,[w,w2+.04,w2-.04],x=>pct(x,2),`f(${b})=${pct(1-f,2)}. Khối lượng đồng vị trong 1 mol hợp chất là k·f·A; sau đó chia M hợp chất.`,'%m đồng vị = k·f·A / (kM̄ + M_phần_khác)','Không dùng 1−(%m đồng vị kia) vì trong hợp chất còn các nguyên tố khác.')}
function m6gen(i,adv){let [a,b,s]=pairs[(i+4)%pairs.length],f=[.73,.46,.82,.91,.992,.625][i%6],M=a*f+b*(1-f);if(!adv){let mass=[6.354,10,20,32,5][i%5],molIso=mass/M*f;return qnum('m6',i,adv,`Mẫu ${s} khối lượng ${mass} g có M̄=${fmt(M,3)}; đồng vị ${a}${s} chiếm ${pct(f,1)} số nguyên tử. Số mol ${a}${s} có trong mẫu gần bằng?`,molIso,[molIso*.8,molIso*1.2,mass/a*f],x=>fmt(x,4)+' mol',`n(${s})=m/M̄=${fmt(mass/M,4)} mol; n(${a}${s})=n·f=${fmt(molIso,4)} mol.`,'n đồng vị = (m/M̄)·f','Mẫu tự nhiên phải chia cho M̄, không chia trực tiếp cho số khối đồng vị.')}let k=[1,2,3][i%3],other=[16,40,95][i%3],mass=[18.016,39.968,120.381][i%3],Mcmp=k*M+other,ncmp=mass/Mcmp,N=ncmp*k*f*NA;return qnum('m6',i,adv,`Có ${mass} g hợp chất chứa ${k} nguyên tử ${s} trong mỗi công thức; M_hợp chất=${fmt(Mcmp,3)} g/mol. Đồng vị ${a}${s} chiếm ${pct(f,2)}. Số nguyên tử ${a}${s} gần bằng?`,N,[N/10,N*10,N*(1-f)/f],x=>sci(x,2),`n_hợp chất=${fmt(ncmp,4)} mol → mol nguyên tử ${s}=n·${k}; lấy phần ${pct(f,2)} rồi nhân Nₐ.`,'Nᵢ=n_hợp chất·k·fᵢ·Nₐ','Nhớ hệ số k của nguyên tố trong công thức hóa học.')}
function m7gen(i,adv){let x=[1,2,3,4,5,6][i%6],a=35,b=37,f=.75,M=a*f+b*(1-f),den=1+M+16*x,w=f*a/den;if(!adv){return qnum('m7',i,adv,`Trong HClOₓ, chlorine gồm 35Cl (${pct(f,0)}) và 37Cl. M̄(Cl)=${fmt(M,1)}. Biết 35Cl chiếm ${pct(w,2)} khối lượng hợp chất. x bằng?`,x,[Math.max(1,x-1),x+1,x+2],n=>Math.round(n).toString(),`Lập ${fmt(w*100,2)}/100 = (${a}·${f})/[1+${fmt(M,1)}+16x]. Giải ra x=${x}.`,'w(35Cl)=f·35/[1+M̄Cl+16x]','Mẫu số chứa M̄Cl, tử số chứa 35·f.')}let k=[1,2,3][i%3],other=[23,39,56][i%3],y=[1,2,3,4][i%4],Mcmp=other+k*M+16*y,w2=k*(1-f)*b/Mcmp;return qnum('m7',i,adv,`Một hợp chất giả định có dạng RCl${k===1?'':'₍'+k+'₎'}Oᵧ với M(R)=${other}; chlorine có 35Cl/37Cl = 75%/25%. Nếu 37Cl chiếm ${pct(w2,2)} khối lượng, y bằng?`,y,[Math.max(1,y-1),y+1,y+2],n=>Math.round(n).toString(),`Dùng w = k·0,25·37/[M(R)+k·35,5+16y]. Giải ra y=${y}.`,'%m đồng vị = k·f·A/M_hợp chất','Chỉ số k phải xuất hiện ở cả tử số và phần chlorine của mẫu số.')}
function m8gen(i,adv){if(!adv){let MX=[35.5,79.92][i%2],mNaX=[5.85,10.292][i%2],n=mNaX/(23+MX),mAgX=n*(108+MX);return qnum('m8',i,adv,`Cho ${fmt(mNaX,3)} g NaX phản ứng hoàn toàn với AgNO₃ dư, thu ${fmt(mAgX,3)} g AgX. Nguyên tử khối trung bình của X gần bằng?`,MX,[MX+2,MX-2,(MX+23+108)/2],x=>fmt(x,2),`Cùng số mol: m(AgX)−m(NaX)=n·(108−23)=85n. Suy n, rồi M̄X=m(NaX)/n−23=${fmt(MX,2)}.`,'nNaX=nAgX; Δm=85n','Giải phần phản ứng trước; chưa dùng công thức đồng vị ngay.')}let Z=[8,12,17,35][i%4],A1=[16,24,35,79][i%4],A2=A1+2,f=[.99757,.79,.75,.54][i%4],T1=Z+A1,T2=Z+A2,M=A1*f+A2*(1-f);return qnum('m8',i,adv,`Hai đồng vị của X có cùng Z=${Z}; tổng p+n+e lần lượt là ${T1} và ${T2}. Đồng vị nhẹ chiếm ${pct(f,2)}. M̄ của X gần bằng?`,M,[M+.5,M-.5,(A1+A2)/2],x=>fmt(x,4),`Với nguyên tử trung hòa: p+n+e=Z+A ⇒ A=T−Z. Suy A₁=${A1}, A₂=${A2}; rồi tính trung bình có trọng số.`,'T=p+n+e=Z+A; sau đó M̄=ΣAᵢfᵢ','Cùng nguyên tố nên Z giống nhau; đừng coi T chính là số khối.')}
const gens={m1:m1gen,m2:m2gen,m3:m3gen,m4:m4gen,m5:m5gen,m6:m6gen,m7:m7gen,m8:m8gen};let BANK=[];function genBank(){BANK=[];for(const m of modules){for(let i=0;i<50;i++)BANK.push(gens[m.id](i,false));for(let i=0;i<50;i++)BANK.push(gens[m.id](i,true))}}

function renderHome(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-home').innerHTML=`<div class="hero card"><div><span class="tag blue">LIVE 7 + LIVE 8 · ISOTOPE VIP</span><h2>Đồng vị từ nền tảng → bài VIP tổng hợp</h2><p>Học theo một trục duy nhất: <b>số khối & tỉ lệ → nguyên tử khối trung bình → suy thành phần → chuyển sang % khối lượng / số nguyên tử / phản ứng.</b></p><div class="memoryStrip"><span>800 câu luyện</span><span>8 dạng × 100</span><span>30 câu bám file</span><span>50 cơ bản + 50 nâng cao/dạng</span><span>Tư duy ngược + chữa lỗi 5 bước</span></div><button class="btn primary" onclick="nav('practice')">Bắt đầu luyện</button></div><div class="viz"><div class="formulaCore"><div class="eqrow"><span>Trung bình</span><strong>M̄=ΣAf</strong></div><div class="eqrow"><span>2 đồng vị</span><strong>f₁=(A₂−M̄)/(A₂−A₁)</strong></div><div class="eqrow"><span>% khối lượng</span><strong>w=kfA/M</strong></div><div class="eqrow"><span>Số nguyên tử</span><strong>N=nkfNₐ</strong></div></div></div></div><div class="grid g4" style="margin-top:15px"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai cần ôn</span></div></div><div class="card" style="margin-top:15px"><h3>Bản đồ công thức cốt lõi</h3><table class="formula-table"><tr><th>Dữ kiện</th><th>Công thức bật ra</th><th>Câu tự hỏi</th></tr><tr><td>2 đồng vị + tỉ lệ</td><td class="miniEq">M̄=(A₁x₁+A₂x₂)/(x₁+x₂)</td><td>Tỉ lệ đã chuẩn hóa chưa?</td></tr><tr><td>M̄ + A₁,A₂</td><td class="miniEq">f₁=(A₂−M̄)/(A₂−A₁)</td><td>Đang hỏi % số nguyên tử hay % khối lượng?</td></tr><tr><td>Đồng vị trong hợp chất</td><td class="miniEq">%m=kfA/M_hc×100</td><td>Hệ số k bằng mấy?</td></tr><tr><td>Số nguyên tử đồng vị</td><td class="miniEq">N=n·k·f·Nₐ</td><td>Đã đổi mẫu → mol chưa?</td></tr><tr><td>Phản ứng</td><td class="miniEq">stoichiometry → M̄X → f</td><td>Đồng vị đang bị giấu ở bước nào?</td></tr></table></div>`}

function reverseThinking(q){let map={m1:{goal:'Tìm nguyên tử khối trung bình.',chain:'M̄ ← A₁,A₂ và trọng số ← tỉ lệ / % số nguyên tử',steps:['Chuẩn hóa tỉ lệ hoặc % về cùng dạng.','Nhân mỗi số khối với trọng số tương ứng.','Cộng rồi chia tổng trọng số.'],trap:'M̄ phải nằm giữa các số khối.'},m2:{goal:'Tìm M̄ hoặc phần trăm một đồng vị trong hệ 3 đồng vị.',chain:'Ẩn cần tìm ← M̄=ΣAf + Σf=1 ← dữ liệu peak / %',steps:['Tính phần trăm còn thiếu.','Lập phương trình trung bình.','Kiểm tra tổng phần trăm =100%.'],trap:'Nếu đọc phổ MS, chiều cao peak là hàm lượng tương đối.'},m3:{goal:'Tìm tỉ lệ/phần trăm/số nguyên tử.',chain:'f ← M̄ và A₁,A₂ ← sau đó n₁/n₂=f₁/f₂',steps:['Tìm f bằng công thức hai đồng vị.','Đổi f thành tỉ lệ.','Nhân chéo để suy số nguyên tử.'],trap:'% số nguyên tử không phải % khối lượng.'},m4:{goal:'Tìm số khối chưa biết.',chain:'A chưa biết ← quan hệ ΔN, tổng A, tỉ lệ ← M̄ để khóa nghiệm',steps:['Dùng “cùng nguyên tố” ⇒ Z giống nhau.','Đổi quan hệ neutron thành quan hệ số khối.','Dùng M̄ kiểm tra/chọn nghiệm nguyên.'],trap:'Số khối A luôn là số nguyên.'},m5:{goal:'Tìm % khối lượng một đồng vị trong hợp chất.',chain:'%mᵢ ← mᵢ trong 1 mol hợp chất / M_hợp chất ← fᵢ,Aᵢ,k',steps:['Tìm fᵢ từ M̄ nếu cần.','Tính M hợp chất bằng M̄ của nguyên tố.','Tử số = k·fᵢ·Aᵢ.'],trap:'Mẫu số dùng M̄; tử số dùng đúng Aᵢ.'},m6:{goal:'Tìm số mol / số nguyên tử đồng vị.',chain:'Nᵢ ← n nguyên tử X ← n mẫu ← m/M hoặc V,D',steps:['Đổi mẫu về mol hợp chất/nguyên tố.','Nhân hệ số nguyên tử k.','Nhân fᵢ rồi Nₐ nếu hỏi số hạt.'],trap:'Không quên hệ số nguyên tử trong công thức.'},m7:{goal:'Tìm chỉ số x,y của công thức.',chain:'x/y ← M_hợp chất ← phương trình %m đồng vị',steps:['Tính f đồng vị từ M̄.','Viết M hợp chất theo x/y.','Lập phương trình %m và chọn nghiệm nguyên hợp lí.'],trap:'Chỉ số hóa học phải là số nguyên dương.'},m8:{goal:'Tách bài tổng hợp thành “hóa học trước – đồng vị sau”.',chain:'đại lượng đồng vị ← M̄X ← số mol phản ứng / tổng hạt ← dữ kiện ban đầu',steps:['Giải stoichiometry hoặc p,n,e trước.','Suy M̄ hoặc số khối.','Cuối cùng mới dùng công thức đồng vị.'],trap:'Đừng trộn hai tầng bài toán vào một phương trình ngay từ đầu.'}};return map[q.module]}
function analysisHTML(q){if(!q.calc)return'';let r=reverseThinking(q);return `<details class="analysisBox" open><summary>🧠 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đề đang hỏi gì?</h4><p>${r.goal}</p><h4>2. Công thức bật ra</h4><p>${esc(q.rule)}</p></div><div class="analysisCard reverse"><h4>↩ Tư duy ngược</h4><div class="analysisArrow">${r.chain}</div><ol class="analysisSteps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></div><div class="analysisHint"><b>Bẫy cần kiểm:</b> ${r.trap}</div></div></details>`}

function choose(i){if(quiz.checked)return;quiz.sel=i;renderQuiz()}function check(){let q=quiz.list[quiz.idx];if(quiz.checked){move(1);return}if(quiz.sel===null){toast('Chọn một đáp án trước');return}quiz.checked=true;let ok=quiz.sel===q.a;st.attempted++;if(ok){st.correct++;st.xp+=10}else{st.xp+=2;if(!st.wrong.some(x=>x.id===q.id))st.wrong.push({...q,chosen:quiz.sel})}st.done[q.module]=Math.min(100,(st.done[q.module]||0)+(ok?1.5:.4));save();updateTop();$$('.opt').forEach((b,i)=>{if(i===q.a)b.classList.add('ok');if(i===quiz.sel&&!ok)b.classList.add('bad');b.disabled=true});$('#fb').innerHTML=`<div class="feedback ${ok?'explain':'warning'}"><h3>${ok?'✓ Chính xác':'✗ Chưa đúng'}</h3><div class="answerCompare"><div class="answerPill ${ok?'good':'bad'}"><b>Em chọn</b><br>${esc(q.opts[quiz.sel])}</div><div class="answerPill good"><b>Đáp án đúng</b><br>${esc(q.opts[q.a])}</div></div><p><b>Giải thích theo bản chất:</b> ${esc(q.expl)}</p><p><b>Công thức / quy tắc:</b> ${esc(q.rule)}</p><p><b>Bẫy dễ sai:</b> ${esc(q.trap)}</p>${!ok?`<button class="btn purpleBtn" onclick="openGap('${q.module}')">Mở 5 câu tìm lỗ hổng</button>`:''}</div>`;$('#checkBtn').textContent='Câu tiếp →'}

function openGap(mid){let qs=diag[mid];openModal(`<span class="tag purple">Chữa lỗi 5 bước</span><h2>Tự tìm lỗ hổng · ${modules.find(m=>m.id===mid).title}</h2><p class="muted">Làm 5 câu ngắn để xác định chính xác mắt xích vừa sai.</p>${qs.map((q,qi)=>`<div class="diagq"><b>Bước ${qi+1}/5</b><p>${q[0]}</p><div class="diagopts">${q[1].map((o,oi)=>`<button class="diagopt" onclick="diagChoose(this,${oi},${q[2]})">${'ABCD'[oi]}. ${o}</button>`).join('')}</div></div>`).join('')}`)}function diagChoose(btn,i,a){let box=btn.closest('.diagopts');[...box.children].forEach(x=>x.disabled=true);btn.classList.add(i===a?'good':'bad');if(i!==a)box.children[a].classList.add('good')}
function renderWrong(){let a=st.wrong;$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Câu sai được gom theo đúng dạng để quay lại công thức và chuỗi 5 bước.</p></div><button class="btn secondary" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${a.length?a.map((q,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><h3>${esc(q.text)}</h3><p><b>Đáp án đúng:</b> ${esc(q.opts[q.a])}</p><p><b>Quy tắc cần ôn:</b> ${esc(q.rule)}</p><button class="btn purpleBtn" onclick="openGap('${q.module}')">Luyện 5 bước</button></div>`).join(''):'<div class="card"><h3>Chưa có câu sai 🎯</h3><p class="muted">Làm bài để hệ thống tự xây sổ lỗi.</p></div>'}`}
function renderReport(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Lưu cục bộ bằng localStorage.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${m.icon} LIVE ${m.live} · ${m.title}</b><span>${Math.round(st.done[m.id]||0)}%</span></div><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div></div>`).join('')}</div>`}
